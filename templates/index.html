<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title data-i18n="title">OshiShield Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #0f0f0f;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            padding: 20px;
        }

        h1 {
            font-size: 24px;
            margin-bottom: 5px;
            color: white;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 30px;
        }

        .stats {
            display: flex;
            gap: 16px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 16px 24px;
            flex: 1;
            text-align: center;
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: bold;
            color: white;
        }

        .stat-card .label {
            font-size: 12px;
            color: #888;
            margin-top: 4px;
        }

        .stat-card.flagged .number { color: #ff4444; }
        .stat-card.clean .number { color: #44ff88; }

        .messages-header {
            font-size: 14px;
            color: #888;
            margin-bottom: 12px;
        }

        .message {
            background: #1a1a1a;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 8px;
            border-left: 3px solid #333;
        }

        .message.flagged {
            border-left-color: #ff4444;
            background: #1f1010;
        }

        .message .author {
            font-size: 12px;
            color: #888;
            margin-bottom: 4px;
        }

        .message .text {
            font-size: 14px;
            color: #e0e0e0;
        }

        .message .reasons {
            font-size: 11px;
            color: #ff4444;
            margin-top: 6px;
        }

        .badge {
            display: inline-block;
            background: #ff4444;
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            margin-right: 6px;
        }

        .shield {
            display: inline;
            color: #4488ff;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
        }

        #lang {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 6px 10px;
            font-size: 13px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="topbar">
        <div>
            <h1>🛡️ OshiShield <span class="shield" data-i18n="dashboard">Dashboard</span></h1>
            <p class="subtitle" data-i18n="subtitle">Real-time livestream harassment detection for anonymous creators</p>
        </div>
        <select id="lang" aria-label="Language">
            <option value="en">English</option>
            <option value="ru">Русский</option>
            <option value="ja">日本語</option>
        </select>
    </div>

    <div class="stats" id="stats">
        <div class="stat-card">
            <div class="number" id="total">—</div>
            <div class="label" data-i18n="total">Total Messages</div>
        </div>
        <div class="stat-card flagged">
            <div class="number" id="flagged">—</div>
            <div class="label" data-i18n="flagged">Flagged</div>
        </div>
        <div class="stat-card clean">
            <div class="number" id="clean">—</div>
            <div class="label" data-i18n="clean">Clean</div>
        </div>
        <div class="stat-card">
            <div class="number" id="streams">—</div>
            <div class="label" data-i18n="streams">Streams Monitored</div>
        </div>
    </div>

    <div class="messages-header" data-i18n="recent">Recent messages (newest first)</div>
    <div id="messages"></div>

    <script>
        // ---------- translations ----------
        const I18N = {
            en: {
                title: 'OshiShield Dashboard',
                dashboard: 'Dashboard',
                subtitle: 'Real-time livestream harassment detection for anonymous creators',
                total: 'Total Messages',
                flagged: 'Flagged',
                clean: 'Clean',
                streams: 'Streams Monitored',
                recent: 'Recent messages (newest first)',
                badge: '🚨 FLAGGED',
                hate: 'Hate speech',
                doxx: 'Doxxing',
                doxxOld: 'Doxxing pattern detected',
                coordinated: 'Coordinated attack: {n} accounts same message'
            },
            ru: {
                title: 'OshiShield — панель',
                dashboard: 'Панель',
                subtitle: 'Обнаружение травли в прямых эфирах в реальном времени для анонимных авторов',
                total: 'Всего сообщений',
                flagged: 'Помечено',
                clean: 'Чистые',
                streams: 'Отслеживаемые стримы',
                recent: 'Последние сообщения (сначала новые)',
                badge: '🚨 ПОМЕЧЕНО',
                hate: 'Язык вражды',
                doxx: 'Доксинг',
                doxxOld: 'Обнаружен паттерн доксинга',
                coordinated: 'Скоординированная атака (аккаунтов: {n}), одно и то же сообщение'
            },
            ja: {
                title: 'OshiShield ダッシュボード',
                dashboard: 'ダッシュボード',
                subtitle: '匿名クリエイターのためのライブ配信ハラスメントのリアルタイム検出',
                total: '総メッセージ数',
                flagged: '検出',
                clean: '問題なし',
                streams: '監視中の配信',
                recent: '最新のメッセージ（新しい順）',
                badge: '🚨 検出',
                hate: 'ヘイトスピーチ',
                doxx: 'ドキシング',
                doxxOld: 'ドキシングのパターンを検出',
                coordinated: '組織的な攻撃：{n}アカウントが同じメッセージを投稿'
            }
        };

        let lang = 'en';
        let lastMessages = [];

        function t(key) {
            return (I18N[lang] && I18N[lang][key]) || I18N.en[key] || key;
        }

        // The backend writes reasons in English; translate the known ones for display
        function translateReason(r) {
            const m = r.match(/^Coordinated attack: (\d+) accounts same message$/);
            if (m) return t('coordinated').replace('{n}', m[1]);
            if (r === 'Doxxing pattern detected') return t('doxxOld');
            if (r.startsWith('Hate speech:')) return t('hate') + ':' + r.slice('Hate speech:'.length);
            if (r.startsWith('Doxxing:')) return t('doxx') + ':' + r.slice('Doxxing:'.length);
            return r;
        }

        function pickLanguage() {
            try {
                const saved = localStorage.getItem('lang');
                if (saved && I18N[saved]) return saved;
            } catch (e) { /* storage can be blocked */ }
            const nav = (navigator.language || 'en').slice(0, 2);
            return I18N[nav] ? nav : 'en';
        }

        function setLang(next) {
            lang = I18N[next] ? next : 'en';
            try { localStorage.setItem('lang', lang); } catch (e) {}
            document.documentElement.lang = lang;
            document.title = t('title');
            document.querySelectorAll('[data-i18n]').forEach(node => {
                node.textContent = t(node.dataset.i18n);
            });
            document.getElementById('lang').value = lang;
            renderMessages();
        }

        // ---------- rendering (textContent only, so chat text is never parsed as HTML) ----------
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        async function loadStats() {
            const res = await fetch('/api/stats');
            if (!res.ok) throw new Error('stats HTTP ' + res.status);
            const data = await res.json();
            document.getElementById('total').textContent = data.total.toLocaleString();
            document.getElementById('flagged').textContent = data.flagged.toLocaleString();
            document.getElementById('clean').textContent = data.clean.toLocaleString();
            document.getElementById('streams').textContent = data.streams.toLocaleString();
        }

        function renderMessage(msg) {
            const div = el('div', 'message' + (msg.flagged ? ' flagged' : ''));

            if (msg.flagged) {
                div.appendChild(el('span', 'badge', t('badge')));
            }

            const time = String(msg.timestamp || '').slice(0, 16).replace('T', ' ');
            const meta = [msg.author, msg.video_id, time].filter(Boolean).join(' · ');
            div.appendChild(el('div', 'author', meta));
            div.appendChild(el('div', 'text', msg.text));

            const reasons = msg.reasons || [];
            if (reasons.length) {
                div.appendChild(el('div', 'reasons', reasons.map(translateReason).join(', ')));
            }
            return div;
        }

        function renderMessages() {
            document.getElementById('messages').replaceChildren(...lastMessages.map(renderMessage));
        }

        async function loadMessages() {
            const res = await fetch('/api/messages');
            if (!res.ok) throw new Error('messages HTTP ' + res.status);
            lastMessages = await res.json();
            renderMessages();
        }

        async function refresh() {
            try {
                await Promise.all([loadStats(), loadMessages()]);
            } catch (err) {
                console.error('Dashboard refresh failed:', err);  // keep old data on screen
            }
        }

        document.getElementById('lang').addEventListener('change', e => setLang(e.target.value));
        setLang(pickLanguage());
        refresh();
        setInterval(refresh, 10000);
    </script>

</body>
</html>
